version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: internproof-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: internproof
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internproof-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/internproof?schema=public
      JWT_SECRET: dev_super_secret_internproof_production_jwt_key_32chars
    ports:
      - '5000:5000'
    depends_on:
      - postgres

volumes:
  pgdata:
